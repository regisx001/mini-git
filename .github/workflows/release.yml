name: Create Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up GraalVM
      uses: graalvm/setup-graalvm@v1
      with:
        java-version: '21'
        distribution: 'graalvm'
        github-token: ${{ secrets.GITHUB_TOKEN }}
        cache: 'maven'
    
    - name: Extract version from pom.xml
      id: get_version
      shell: bash
      run: |
        VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "Extracted version: $VERSION"
    
    - name: Build with Maven
      run: mvn -B package --file pom.xml
      
    - name: Build Native Image
      run: mvn -Pnative native:compile --file pom.xml
    
    - name: Rename binary for OS
      shell: bash
      run: |
        if [ "$RUNNER_OS" == "Windows" ]; then
          mv target/minigit.exe target/minigit-windows.exe
        elif [ "$RUNNER_OS" == "macOS" ]; then
          mv target/minigit target/minigit-macos
        else
          mv target/minigit target/minigit-linux
        fi
        
    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ${{ github.ref_name }}
        name: Release ${{ steps.get_version.outputs.version }}
        append_body: true
        body: |
          ## MiniGit Release ${{ steps.get_version.outputs.version }}
          
          Educational Git-like version control system
          
          ### Installation
          Download the native binary for your platform or the JAR file:
          
          **Native Binary (Linux/macOS):**
          ```bash
          chmod +x minigit-<os>
          ./minigit-<os> <command>
          ```
          
          **Native Binary (Windows):**
          ```cmd
          minigit-windows.exe <command>
          ```
          
          **JAR File:**
          ```bash
          java -jar minigit-${{ steps.get_version.outputs.version }}.jar <command>
          ```
          
          ### Available Commands
          - `init` - Initialize a new repository
          - `add <file>` - Add files to staging area
          - `commit -m "message"` - Create a commit
          - `log` - View commit history
          - `status` - Check repository status
        files: |
          target/minigit-${{ steps.get_version.outputs.version }}.jar
          target/minigit-linux
          target/minigit-macos
          target/minigit-windows.exe
        draft: false
        prerelease: false
