name: Create Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-binaries:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up GraalVM
      uses: graalvm/setup-graalvm@v1
      with:
        java-version: '21'
        distribution: 'graalvm'
        github-token: ${{ secrets.GITHUB_TOKEN }}
        cache: 'maven'
    
    - name: Extract version from pom.xml
      id: get_version
      shell: bash
      run: |
        VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "Extracted version: $VERSION"
    
    - name: Build with Maven
      run: mvn -B package --file pom.xml
      
    - name: Build Native Image
      run: mvn -Pnative native:compile --file pom.xml
    
    - name: Rename binary for OS
      shell: bash
      run: |
        VERSION=${{ steps.get_version.outputs.version }}
        if [ "$RUNNER_OS" == "Windows" ]; then
          mv target/minigit.exe target/minigit-${VERSION}-windows.exe
        elif [ "$RUNNER_OS" == "macOS" ]; then
          mv target/minigit target/minigit-${VERSION}-macos
        else
          mv target/minigit target/minigit-${VERSION}-linux
        fi

    - name: Upload Native Binary
      uses: actions/upload-artifact@v4
      with:
        name: minigit-binary-${{ matrix.os }}
        path: target/minigit-${{ steps.get_version.outputs.version }}-*
        
    - name: Upload JAR
      if: matrix.os == 'ubuntu-latest'
      uses: actions/upload-artifact@v4
      with:
        name: minigit-jar
        path: target/minigit-${{ steps.get_version.outputs.version }}.jar

  create-release:
    needs: build-binaries
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Extract version from pom.xml
      id: get_version
      shell: bash
      run: |
        VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        
    - name: Download Artifacts
      uses: actions/download-artifact@v4
      with:
        path: release-artifacts
        merge-multiple: true
        
    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ${{ github.ref_name }}
        name: Release ${{ steps.get_version.outputs.version }}
        body: |
          ## MiniGit Release ${{ steps.get_version.outputs.version }}
          
          Educational Git-like version control system
          
          ### Installation
          Download the native binary for your platform or the JAR file:
          
          **Native Binary (Linux/macOS):**
          ```bash
          chmod +x minigit-${{ steps.get_version.outputs.version }}-<os>
          ./minigit-${{ steps.get_version.outputs.version }}-<os> <command>
          ```
          
          **Native Binary (Windows):**
          ```cmd
          minigit-${{ steps.get_version.outputs.version }}-windows.exe <command>
          ```
          
          **JAR File:**
          ```bash
          java -jar minigit-${{ steps.get_version.outputs.version }}.jar <command>
          ```
          
          ### Available Commands
          - `init` - Initialize a new repository
          - `add <file>` - Add files to staging area
          - `commit -m "message"` - Create a commit
          - `log` - View commit history
          - `status` - Check repository status
        files: release-artifacts/*
        draft: false
        prerelease: false
